root = "/workspace/server"
tmp_dir = "/tmp/taskagent-air"

[build]
cmd = "go build -ldflags '-X main.commit=dev-hot-reload' -o /tmp/taskagent-air/server ./cmd/server"
bin = "/tmp/taskagent-air/server"
include_ext = ["go", "sql", "json"]
exclude_dir = ["bin", "tmp", "vendor"]
delay = 800
stop_on_error = true
send_interrupt = true
kill_delay = "1s"

[log]
time = true

[misc]
clean_on_exit = true
